name: FixGradlew
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          find . -name "gradlew" -type f
          FOUND=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found: $FOUND"
          if [ -n "$FOUND" ]; then
            cp "$FOUND" ./gradlew
            cp "${FOUND%/*}/gradlew.bat" ./gradlew.bat 2>/dev/null || true
            cp -r ${FOUND%/*}/../gradle ./gradle 2>/dev/null || cp -r ${FOUND%/*}/../../gradle ./gradle 2>/dev/null || true
            chmod +x ./gradlew
            ls -la ./gradlew
          fi
          # Also ensure wrapper
          ls -la
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Fix gradlew to root" || true
          git push
