name: UltimateFix
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "BEFORE:"
          ls -la
          find . -name "build.gradle*" | head -20
          # Find the REAL app that has src/main with hymn data
          REAL=$(find . -type d -name "app" | xargs -I{} sh -c 'ls {}/src/main/assets 2>/dev/null && echo {}' | head -n1)
          echo "Real app guess: $REAL"
          # If not found, find deepest app
          if [ -z "$REAL" ]; then REAL=$(find . -path "*/app/src/main/*" | head -1 | sed 's|/app/.*||'); fi
          echo "Real project root: $REAL"
          # Find deepest gradle project
          DEEPEST=$(find . -name "settings.gradle*" -exec dirname {} \; | awk '{print length, $0}' | sort -nr | head -n1 | cut -d' ' -f2-)
          echo "Deepest settings: $DEEPEST"
          # Copy deepest to root temp
          mkdir /tmp/real
          cp -r $DEEPEST/* /tmp/real/ 2>/dev/null || true
          cp -r $DEEPEST/.* /tmp/real/ 2>/dev/null || true
          # Clean root except .git and .github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -r /tmp/real/* ./
          cp -r /tmp/real/.* ./ 2>/dev/null || true
          ls -la
          echo "AFTER:"
          ls -la app/src/main 2>/dev/null || true
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Ultimate fix real app to root" || true
          git push
