name: super
on: workflow_dispatch
permissions:
  contents: write
jobs:
  super:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "BEFORE:"
          ls -R | head -n 100
          find . -type f -name "pubspec.yaml" -o -name "android" -type d | head -20
          # Find real app folder that has lib/ and move it to root
          REAL=$(find . -type d -name "lib" | grep -v ".git" | head -1 | xargs dirname)
          echo "Real app in: $REAL"
          if [ "$REAL" != "." ] && [ -n "$REAL" ]; then
            cp -r $REAL/* ./
            cp -r $REAL/.* ./ 2>/dev/null || true
          fi
          rm -rf Triune-Hymn-V2 || true
          echo "AFTER:"
          ls -la
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Super flatten real app" || true
          git push
