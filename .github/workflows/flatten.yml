name: flatten
on: workflow_dispatch
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pwd
          ls -la
          # Loop until no nested Triune folder
          while [ -d "Triune-Hymn-V2" ]; do
            echo "Found nested Triune-Hymn-V2, moving up..."
            mv Triune-Hymn-V2/* ./ 2>/dev/null || true
            mv Triune-Hymn-V2/.* ./ 2>/dev/null || true
            rmdir Triune-Hymn-V2 2>/dev/null || rm -rf Triune-Hymn-V2
          done
          echo "AFTER FLATTEN:"
          ls -la
          ls -la app/src/main/assets 2>/dev/null | head -20 || ls -la app/src/main/ | head -20
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Flatten to real app" || echo "no changes"
          git push
