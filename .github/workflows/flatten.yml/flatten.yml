name: flatten
on: workflow_dispatch
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while [ -d "Triune-Hymn-V2" ]; do mv Triune-Hymn-V2/* ./ 2>/dev/null; mv Triune-Hymn-V2/.* ./ 2>/dev/null; rm -rf Triune-Hymn-V2; done
          ls -la
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Flatten real app" || true
          git push
