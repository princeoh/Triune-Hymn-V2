name: SetLogo
on: workflow_dispatch
jobs:
  logo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert logo.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert logo.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert logo.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert logo.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert logo.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert logo.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable/triune_logo.png 2>/dev/null || mkdir -p app/src/main/res/drawable && cp logo.png app/src/main/res/drawable/triune_logo.png
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Set exact Triune Hymn logo as-is" || true
          git push
