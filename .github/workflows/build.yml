name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > ./Triune-Hymn-V2/local.properties 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > ./Triune-Hymn-V2/Triune-Hymn-V2/local.properties 2>/dev/null || true
          cat local.properties
          ls -la
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Triune-Hymn-V2-APK
          path: "**/build/outputs/apk/debug/*.apk"
