name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Check files
        run: |
          ls -la
          ls -la app || true
          cat app/build.gradle.kts 2>/dev/null | head -n 20 || cat app/build.gradle | head -n 20 || echo "no app build file"
      - name: Build APK with Gradle (no wrapper needed)
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Triune-Hymn-V2-APK
          path: app/build/outputs/apk/debug/*.apk
