name: Flatten
on: workflow_dispatch

jobs:
  flat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          FOLDER="TriuneHymn--main"
          if [ -d "$FOLDER" ]; then
            shopt -s dotglob
            mv $FOLDER/* .
            rm -rf $FOLDER
          fi
          rm -rf .github/workflows/unzip.yml .github/workflows/flatten.yml source.zip
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Flatten to root" || true
          git push
