name: FixRootFinal
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          ls -la
          echo "--- inside nested ---"
          ls -la TriuneHymn--main || echo "no nested folder at root, check TriuneHymn--main"
          # Remove existing app at root if any to allow move
          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties .gitignore metadata.json
          # Move everything from nested to root
          mv TriuneHymn--main/* . || true
          mv TriuneHymn--main/.* . || true
          rm -rf TriuneHymn--main
          ls -la
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Final root fix" || echo "nothing to commit"
          git push
