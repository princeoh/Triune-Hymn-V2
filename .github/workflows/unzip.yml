name: FlattenFinal
on: workflow_dispatch

jobs:
  flat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -la
          if [ -d "TriuneHymn--main" ]; then
            cp -r TriuneHymn--main/. .
            rm -rf TriuneHymn--main
            echo "Flattened"
          fi
          ls -la
          rm -rf source.zip
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Force flatten to root" || true
          git push
