name: FixRoot
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv TriuneHymn--main/app ./app || true
          mv TriuneHymn--main/gradle ./gradle || true
          mv TriuneHymn--main/build.gradle.kts ./ || true
          mv TriuneHymn--main/settings.gradle.kts ./ || true
          mv TriuneHymn--main/gradle.properties ./ || true
          mv TriuneHymn--main/README.md ./README2.md || true
          mv TriuneHymn--main/.gitignore ./ || true
          mv TriuneHymn--main/metadata.json ./ || true
          rm -rf TriuneHymn--main
          ls
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Move app to root" || true
          git push
