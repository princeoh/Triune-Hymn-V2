name: Unzip Source
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o source.zip
          rm -f source.zip
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add -A
          git commit -m "Unzip" || true
          git push
