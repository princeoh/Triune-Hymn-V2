name: Unzip Source
on:
  push:
    paths:
      - 'source.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o source.zip
          FOLDER=$(unzip -l source.zip | awk '{print $4}' | cut -d'/' -f1 | sort -u | head -1)
          echo "Folder is $FOLDER"
          shopt -s dotglob
          cp -r $FOLDER/* .
          rm -rf $FOLDER source.zip
      - name: Commit files
        run: |
          git config user.name "princeoh"
          git config user.email "princeoh@users.noreply.github.com"
          git add .
          git commit -m "Unzip old project to V2 - all files" || echo "nothing"
          git push
